# Example experiment configuration.
# Copy it into your project (e.g. expe.toml) and run:  <submodule>/expe.sh expe.toml
# Relative paths are resolved against the directory containing this file.
[experiment]
name = "pico2"
results_dir = "results"                  # results go to <results_dir>/<name>/
configurations = [                       # one row per experiment: row i <-> expe_num i-1
	{ clock_source = "PLL64", vreg_output = "1.10V", benchmark_name = "prime", benchmark_size = 5000, clock_freq = 1000000 },
	{ clock_source = "PLL64", vreg_output = "1.10V", benchmark_name = "mat_mul", benchmark_size = 5000, clock_freq = 1000000 },
	{ clock_source = "PLL64", vreg_output = "1.10V", benchmark_name = "mat_mul_float", benchmark_size = 5000, clock_freq = 1000000 },
	{ clock_source = "PLL64", vreg_output = "1.10V", benchmark_name = "mat_mul_double", benchmark_size = 5000, clock_freq = 1000000 },
	{ clock_source = "PLL96", vreg_output = "1.10V", benchmark_name = "prime", benchmark_size = 5000, clock_freq = 1000000 },
	{ clock_source = "PLL96", vreg_output = "1.10V", benchmark_name = "mat_mul", benchmark_size = 5000, clock_freq = 1000000 },
	{ clock_source = "PLL96", vreg_output = "1.10V", benchmark_name = "mat_mul_float", benchmark_size = 5000, clock_freq = 1000000 },
	{ clock_source = "PLL96", vreg_output = "1.10V", benchmark_name = "mat_mul_double", benchmark_size = 5000, clock_freq = 1000000 },
	{ clock_source = "RC_FAST", vreg_output = "1.10V", benchmark_name = "prime", benchmark_size = 5000, clock_freq = 8000000 },
	{ clock_source = "RC_FAST", vreg_output = "1.10V", benchmark_name = "mat_mul", benchmark_size = 5000, clock_freq = 8000000 },
	{ clock_source = "RC_FAST", vreg_output = "1.10V", benchmark_name = "mat_mul_float", benchmark_size = 5000, clock_freq = 8000000 },
	{ clock_source = "RC_FAST", vreg_output = "1.10V", benchmark_name = "mat_mul_double", benchmark_size = 5000, clock_freq = 8000000 },
	{ clock_source = "PLL64", vreg_output = "1.10V", benchmark_name = "prime", benchmark_size = 5000, clock_freq = 64000000 },
	{ clock_source = "PLL64", vreg_output = "1.10V", benchmark_name = "mat_mul", benchmark_size = 5000, clock_freq = 64000000 },
	{ clock_source = "PLL64", vreg_output = "1.10V", benchmark_name = "mat_mul_float", benchmark_size = 5000, clock_freq = 64000000 },
	{ clock_source = "PLL64", vreg_output = "1.10V", benchmark_name = "mat_mul_double", benchmark_size = 5000, clock_freq = 64000000 },
	{ clock_source = "PLL96", vreg_output = "1.10V", benchmark_name = "prime", benchmark_size = 5000, clock_freq = 96000000 },
	{ clock_source = "PLL96", vreg_output = "1.10V", benchmark_name = "mat_mul", benchmark_size = 5000, clock_freq = 96000000 },
	{ clock_source = "PLL96", vreg_output = "1.10V", benchmark_name = "mat_mul_float", benchmark_size = 5000, clock_freq = 96000000 },
	{ clock_source = "PLL96", vreg_output = "1.10V", benchmark_name = "mat_mul_double", benchmark_size = 5000, clock_freq = 96000000 },
]

[remote]
host = "raspberrypi"                     # ssh host of the monitoring device
dir = "/root/dw_ina"                     # working directory on the device
venv = "venv"                            # virtualenv inside dir ("" for none)

[measurement]
script = "measurements.py"               # or "measurements_multicores.py"
nb_confs = 1
nb_iters = 3
nb_benchmarks = 14
offset = 0                               # if other expes were done before, offset conf numbering
iter_offset = 0                          # same, for iteration numbering
timed_only = true                        # sample a fixed number of points instead of following the GPIO trigger
timed_only_samples = 3000                # ~12s at 250Hz

[measurement.ina228]
shunt_ohms = 1.0
max_current_lower = 0.022                # A
max_current_upper = 0.022                # A
num_conf_switch = 20                     # at the END of this conf, switch calibration from lower to upper
